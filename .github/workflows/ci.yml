# CI matrix (design/JM_DESIGN.md sec 12.5). The JM_HOME dirs of failed tests are uploaded as an artifact.
# Manual trigger only (owner direction, 2026-10-21): `gh workflow run ci.yml --ref <branch>`. The whole matrix was
# green on 2026-10-21 (PR #2, run 39576098266).

name: ci

on:
  workflow_dispatch:

jobs:
  jm:
    name: jm ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: unittest
        shell: bash
        env:
          JM_TEST_ARTIFACTS: ${{ runner.temp }}/jm-failed
        run: python -m unittest discover -v tests
      - name: upload failed JM_HOME dirs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: jm-failed-${{ matrix.os }}
          path: ${{ runner.temp }}/jm-failed
          if-no-files-found: ignore

  jm-containers:
    name: jm ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: python-3.6
            image: python:3.6-slim
            setup: "true"
          - name: alpine
            image: alpine:latest
            setup: apk add --no-cache python3
          - name: fedora
            image: fedora:latest
            setup: dnf install -y -q python3
    steps:
      - uses: actions/checkout@v5
      - name: unittest in ${{ matrix.image }}
        run: |
          mkdir -p "$RUNNER_TEMP/jm-failed"
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/jm-failed:/failed" -e JM_TEST_ARTIFACTS=/failed \
            "${{ matrix.image }}" sh -c '${{ matrix.setup }} && cp -r /src /w && cd /w && \
            PY=$(command -v python3 || command -v python) && $PY --version && $PY -m unittest discover -v tests; \
            rc=$?; chmod -R a+rX /failed; exit $rc'
      - name: upload failed JM_HOME dirs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: jm-failed-${{ matrix.name }}
          path: ${{ runner.temp }}/jm-failed
          if-no-files-found: ignore

  # RDD_016: jm ssh / scp / remote against a real sshd on localhost, with a key made by `jm keygen` and authorised
  # by hand (no password anywhere). The command-line and keygen tests run in the `jm` matrix on every OS.
  jm-ssh:
    name: jm ssh round trip (localhost)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: sshd
        run: |
          sudo apt-get install -y -q openssh-server
          sudo systemctl start ssh
      - name: hosts file + key
        run: |
          chmod +x jm.py
          H="$RUNNER_TEMP/jmhosts"
          printf '[ci]\nUser = %s\nHost = localhost\nStrictHostKeyChecking = no\nUserKnownHostsFile = /dev/null\nLogLevel = ERROR\nSignInKey = ~/.ssh/jm_ci\nJm = %s\nJmHome = %s\n' \
            "$(id -un)" "$PWD/jm.py" "$RUNNER_TEMP/jmhome" > "$H"
          chmod 600 "$H"
          JM_HOSTS="$H" python3 jm.py keygen --no-passphrase
          mkdir -p ~/.ssh && cat ~/.ssh/jm_ci.pub >> ~/.ssh/authorized_keys && chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys
          JM_HOSTS="$H" python3 jm.py ssh echo ok
      - name: round trip
        run: JM_TEST_SSH_HOSTS="$RUNNER_TEMP/jmhosts" python3 -m unittest discover -v -s tests -p test_remote.py

  guards:
    name: claude-guards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: cases (python3)
        run: python3 guards/tests/run.py
      - name: cases (python 2.7)
        run: docker run --rm -v "$PWD:/src:ro" python:2.7-slim sh -c 'cp -r /src /w && cd /w && python guards/tests/run.py'
      - name: installer
        run: sh guards/tests/install_test.sh
      - name: installed copy matches guards/
        run: |
          for f in guard.py guard.sh guards.conf.example; do
            cmp "guards/hooks/$f" ".claude/hooks/claude-guards/$f"
          done
