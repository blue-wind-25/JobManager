# CI matrix (design/JM_DESIGN.md sec 12.5). The JM_HOME dirs of failed tests are uploaded as an artifact.
# TEMPORARY: push / pull_request triggers are on while the macOS / Windows fixes are iterated (owner direction,
# 2026-10-21); back to workflow_dispatch only once the matrix is green (state/IMPL_STATE.md).

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  jm:
    name: jm ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: unittest
        shell: bash
        env:
          JM_TEST_ARTIFACTS: ${{ runner.temp }}/jm-failed
        run: python -m unittest discover -v tests
      - name: upload failed JM_HOME dirs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: jm-failed-${{ matrix.os }}
          path: ${{ runner.temp }}/jm-failed
          if-no-files-found: ignore

  jm-containers:
    name: jm ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: python-3.6
            image: python:3.6-slim
            setup: "true"
          - name: alpine
            image: alpine:latest
            setup: apk add --no-cache python3
          - name: fedora
            image: fedora:latest
            setup: dnf install -y -q python3
    steps:
      - uses: actions/checkout@v5
      - name: unittest in ${{ matrix.image }}
        run: |
          mkdir -p "$RUNNER_TEMP/jm-failed"
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/jm-failed:/failed" -e JM_TEST_ARTIFACTS=/failed \
            "${{ matrix.image }}" sh -c '${{ matrix.setup }} && cp -r /src /w && cd /w && \
            PY=$(command -v python3 || command -v python) && $PY --version && $PY -m unittest discover -v tests'
      - name: upload failed JM_HOME dirs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: jm-failed-${{ matrix.name }}
          path: ${{ runner.temp }}/jm-failed
          if-no-files-found: ignore

  guards:
    name: claude-guards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: cases (python3)
        run: python3 guards/tests/run.py
      - name: cases (python 2.7)
        run: docker run --rm -v "$PWD:/src:ro" python:2.7-slim sh -c 'cp -r /src /w && cd /w && python guards/tests/run.py'
      - name: installer
        run: sh guards/tests/install_test.sh
      - name: installed copy matches guards/
        run: |
          for f in guard.py guard.sh guards.conf.example; do
            cmp "guards/hooks/$f" ".claude/hooks/claude-guards/$f"
          done
